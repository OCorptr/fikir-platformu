# Render.com Blueprint — Infrastructure as Code
# https://render.com/docs/blueprint-spec
#
# İki servis:
#   1. fikir-platformu-api   — .NET 10 backend (Docker)
#   2. fikir-platformu-web   — React/Vite frontend (Static Site) + /api proxy
#
# Deploy sonrası Render otomatik hostname atar (örn: fikir-platformu-api.onrender.com).
# Cross-origin cookie auth için Static Site proxy tercih edildi — frontend kodunda değişiklik yok.
#
# Env variable'lar Dashboard'dan ayarlanmalı (sync: false = manual):
#   - api → ConnectionStrings__MySql (TiDB Cloud connection string)
#   - api → Cors__AllowedOrigins__0 (frontend public URL'si: https://fikir-platformu-web.onrender.com)
#   - web → VITE_API_BASE_URL (opsiyonel, proxy kullanıldığı için gerek yok)

services:
  # ---------------- BACKEND ----------------
  - type: web
    name: fikir-platformu-api
    runtime: docker
    rootDir: backend
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__MySql
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Frontend__BaseUrl
        sync: false

  # ---------------- FRONTEND ----------------
  - type: static_site
    name: fikir-platformu-web
    rootDir: frontend
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    publishPath: dist
    autoDeploy: true
    # /api isteklerini backend'e proxy et — cross-origin cookie auth sorunsuz çalışır.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://fikir-platformu-api.onrender.com/api/*