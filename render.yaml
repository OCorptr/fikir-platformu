# Render.com Blueprint — Infrastructure as Code
# https://render.com/docs/blueprint-spec
#
# İki servis:
#   1. fikir-platformu-api   — .NET 10 backend (Docker)
#   2. fikir-platformu-web   — React/Vite frontend (Static Site + /api proxy)
#
# Deploy sonrası Render otomatik hostname atar (örn: fikir-platformu-api.onrender.com).
# Cross-origin cookie auth için Static Site proxy tercih edildi — _redirects dosyası
# frontend/public/ altında (Vite build sırasında dist/ içine kopyalanır).
#
# Env variable'lar Dashboard'dan ayarlanmalı (sync: false = manual):
#   - api → ConnectionStrings__MySql (TiDB Cloud connection string)
#   - api → Cors__AllowedOrigins__0 (frontend public URL'si: https://fikir-platformu-web.onrender.com)
#   - api → Frontend__BaseUrl (verify-email link için)

services:
  # ---------------- BACKEND (.NET 10 / Docker) ----------------
  - type: web
    name: fikir-platformu-api
    runtime: docker
    rootDir: backend
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__MySql
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Frontend__BaseUrl
        sync: false

  # ---------------- FRONTEND (Vite / Static Site) ----------------
  #
  # Sprint 11.86: `type: web` + `runtime: static` -> Render ozel baslik
  # tanimini YOK sayiyor. Canli sayfada CSP ve X-Frame-Options olmadigi
  # Playwright ile olculdu. Static Site ozelligi yalnizca `type: static`
  # ile kullanilabiliyor; boylece asagidaki `headers` blogu uygulanir.
  - type: static
    name: fikir-platformu-web
    rootDir: frontend
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    # SPA fallback
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        headers:
          - name: Cache-Control
            value: no-cache, no-store, must-revalidate
          - name: Content-Security-Policy
            value: >-
              default-src 'self';
              script-src 'self' 'unsafe-inline' 'unsafe-eval';
              style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
              font-src 'self' https://fonts.gstatic.com data:;
              img-src 'self' data: blob:;
              connect-src 'self' https://fikir-platformu.onrender.com;
              frame-ancestors 'none';
              base-uri 'self';
              form-action 'self'
          - name: X-Frame-Options
            value: DENY
          - name: X-Content-Type-Options
            value: nosniff
          - name: Referrer-Policy
            value: strict-origin-when-cross-origin
          - name: Permissions-Policy
            value: geolocation=(), microphone=(), camera=(), payment=()
          - name: Strict-Transport-Security
            value: max-age=31536000; includeSubDomains; preload
      - path: /assets
        headers:
          - name: Cache-Control
            value: public, max-age=31536000, immutable
      - path: /*
        headers:
          - name: Content-Security-Policy
            value: >-
              default-src 'self';
              script-src 'self' 'unsafe-inline' 'unsafe-eval';
              style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
              font-src 'self' https://fonts.gstatic.com data:;
              img-src 'self' data: blob:;
              connect-src 'self' https://fikir-platformu.onrender.com;
              frame-ancestors 'none';
              base-uri 'self';
              form-action 'self'
          - name: X-Frame-Options
            value: DENY
          - name: X-Content-Type-Options
            value: nosniff
          - name: Referrer-Policy
            value: strict-origin-when-cross-origin
          - name: Permissions-Policy
            value: geolocation=(), microphone=(), camera=(), payment=()
          - name: Strict-Transport-Security
            value: max-age=31536000; includeSubDomains; preload