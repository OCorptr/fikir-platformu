# Geleceğin Fikri Platformu — nginx reverse proxy
#
# Kurulum:  DEPLOYMENT.md "6) Nginx reverse proxy" adımında bu dosyayı sunucuya kopyalayın:
#           sudo cp deploy/nginx/fikir.conf /etc/nginx/sites-available/fikir.conf
#           sudo ln -s /etc/nginx/sites-available/fikir.conf /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# AYARLAMANIZ GEREKEN 3 YER (aşağıda <<< ile işaretli):
#   1. server_name        — kendi alan adınız
#   2. ssl_certificate*   — Let's Encrypt sertifika yolları
#   3. root / backend port — frontend dist yolu ve backend adresi
#
# MIMARI: Aynı domain + reverse proxy. Cookie same-origin (SameSite=Lax yeterli),
#         CORS'a gerek yok, tek SSL sertifikası.

# ---- 1) HTTP → HTTPS yönlendirme ----
server {
    listen 80;
    listen [::]:80;
    server_name <<<ALAN_ADINIZ>>>;          # <<< AYARLA >>>

    # Let's Encrypt sertifika doğrulaması HTTP üzerinden çalışmalı.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 2) HTTPS sunucusu ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <<<ALAN_ADINIZ>>>;          # <<< AYARLA >>>

    # Let's Encrypt (certbot) sertifika yolları
    ssl_certificate     <<</etc/letsencrypt/live/ALAN_ADINIZ/fullchain.pem>>>;   # <<< AYARLA >>>
    ssl_certificate_key <<</etc/letsencrypt/live/ALAN_ADINIZ/privkey.pem>>>;       # <<< AYARLA >>>>

    # --- TLS 1.2+ (YEĞİTEK madde: tüm iletişim TLS 1.2+). 1.0/1.1 devre dışı. ---
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Güvenlik header'ları (backend de gönderiyor; burada ikinci katman)
    #
    # CSP frontend için ZORUNLU: HTML sayfasını bu sunucu servis eder, backend
    # middleware'i API yanıtlarına uygulanır. Sprint 11.84'te eksikti.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://www.googleapis.com https://gmail.googleapis.com https://api.resend.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;

    # Sıkıştırma
    gzip             on;
    gzip_v2          on;
    gzip_min_length  1024;
    gzip_types       text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # ---- 3) Frontend (statik) ----
    root  <<</opt/fikir-platformu/frontend/dist>>>;   # <<< AYARLA >>>
    index index.html;

    # SPA fallback — React Router tüm route'ları index.html'e düşer
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite hash'li asset'ler — 1 yıl immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html asla cache'lenmesin (yeni build görünür olsun)
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ---- Backend API ----
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;    # <<< AYARLA (systemd ASNETCORE_URLS) >>>
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 60s;
    }

    # Sağlık kontrolü — erişim kayıtlarına girmesin
    location = /api/health {
        proxy_pass http://127.0.0.1:5000;
        access_log off;
    }
}
