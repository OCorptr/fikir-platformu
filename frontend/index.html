<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="Geleceğin Fikri Platformu" />
    <!-- Sprint 11.92: İKİNCİ SAVUNMA KATMANI.
         Ana politika Render static-site başlığında (render.yaml → dashboard).
         ⚠️ ZAP 21:32 taramasında `script-src unsafe-eval` hâlâ sitede göründü:
         dashboard başlıkları ELLE yönetiliyor, render.yaml yansımıyor.
         Bu meta, başlık güncellenene kadar ikinci katman olur.

         ⚠️ `frame-ancestors` ve `report-uri` META İÇİNDE GEÇERSİZDİR
         (HTTP başlığı gerektirir) — ZAP "Meta Policy Invalid Directive"
         uyarısı verdi. Bu yüzden burada YOK; sunucu başlığında kalıyor. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://fikir-platformu.onrender.com; base-uri 'self'; form-action 'self'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Geleceğin Fikri Platformu</title>
    <link rel="stylesheet" href="/assets/css/fonts.css" />
    <link rel="stylesheet" href="/assets/css/stil.css" />
    <link rel="stylesheet" href="/assets/css/admin-panel.css" />
    <!-- Sprint 11.92: Tema script'i artık HARİCİ dosyada. CSP'nin
         script-src 'unsafe-inline' + 'unsafe-eval' ihtiyacını kaldırır. -->
    <script src="/assets/js/tema.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
