# YEĞİTEK teslim docker-compose (Sprint 9-11.52).
#
# İKİ KURULUM YOLU:
#   A) Kendi MySQL sunucunuz var + nginx reverse proxy (ÖNERİLEN, üretim):
#        cp .env.example .env   →   doldurun
#        docker compose up -d
#      nginx ayarı: deploy/nginx/fikir.conf
#
#   B) MySQL dahil her şey container'da (demo/sahiplenilen sunucu):
#        docker compose --profile with-mysql up -d
#
# VERİTABANI: MySQL 8.0 (TiDB ve MariaDB 10.6+ ile uyumlu).
#   Pomelo.EntityFrameworkCore.MySql 9.0.0. PostgreSQL DESTEKLENMEZ.
#
# ⚠️ DİKKAT: `AdminMaintenance__Secret` tanımlı değilse /api/__maintenance/*
#    endpoint'leri 403 döner (fail-closed). Bu kasıtlıdır.

services:
  # --- Backend (zorunlu) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fikir-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080

      # --- Veritabanı ---
      # Compose içindeki `mysql` servisini kullanacaksanız .env'de şunu yazın:
      #   DB_CONNECTION_STRING="Server=mysql;Port=3306;Database=fikir_platformu;User=fikir;Password=<parola>;SslMode=Preferred;"
      ConnectionStrings__MySql: ${DB_CONNECTION_STRING}

      # --- Bakım/debug endpoint gizli anahtarı (ZORUNLU) ---
      # Tanımlı değilse bu endpoint'ler 403 döner. Güçlü rastgele bir değer verin.
      AdminMaintenance__Secret: ${ADMINMAINTENANCE__SECRET:-}

      # --- İlk sistem yöneticisi (veritabanı boşsa otomatik oluşturur) ---
      # Kurulum sonrası bu ikisini sunucudan kaldırın.
      # Not: .env içinde de `SeedSystemAdmin__Email` adı kullanılır. Aşağıdaki
      # eski adlar (SEED_ADMIN_*) geriye dönük uyum için desteklenir.
      SeedSystemAdmin__Email: ${SeedSystemAdmin__Email:-${SEED_ADMIN_EMAIL:-}}
      SeedSystemAdmin__Password: ${SeedSystemAdmin__Password:-${SEED_ADMIN_PASSWORD:-}}

      # --- E-posta doğrulama / şifre sıfırlama bağlantılarındaki taban adres ---
      Frontend__BaseUrl: ${FRONTEND__BASEURL:-}

      # --- Kullanılmayan hesap yönetimi (YEĞİTEK madde 39) ---
      # Hareketsiz hesaplar otomatik kilitlenir ve raporlanır.
      # SystemAdmin / MinistryOfficial muaftır.
      #   Rapor: GET  /api/admin/pasif-hesaplar
      #   Geri aç: POST /api/admin/pasif-hesaplar/tekrar-aktiflestir
      PasifHesap__Enabled: ${PASIF_HESAP_ENABLED:-true}
      PasifHesap__GunSayisi: ${PASIF_HESAP_GUN:-90}
      PasifHesap__KontrolGunu: ${PASIF_HESAP_KONTROL_GUN:-30}

      # --- Denetim raporları (YEĞİTEK madde 13/18) ---
      # Raporlar bu volume'a yazılır; konteyner yeniden oluşsa da korunur.
      # Sistem yöneticisi Admin Panel > Denetim Raporları ekranından indirir.
      DenetimRapor__Klasor: /var/lib/fikir/denetim-raporlari
      DenetimRapor__SaklamaGun: ${DENETIM_SAKLAMA_GUN:-400}
      DenetimRapor__Etkin: "true"
      volumes:
        - denetim-raporlari:/var/lib/fikir/denetim-raporlari

      # --- CAPTCHA (YEĞİTEK madde 2) ---
      # Yalnızca güvenlik testi sırasında true yapılır; test sonrası kaldırılmalı.
      Captcha__Disabled: ${CAPTCHA_DISABLED:-false}

      # --- CORS ---
      # Aynı domain + nginx reverse proxy önerilir → BOŞ bırakın (SameSite=Lax, CORS yok).
      # Ayrı origin dağıtımda virgülle ayrılmış liste verin.
      Cors__AllowedOrigins: ${Cors__AllowedOrigins:-${CORS_ALLOWED_ORIGINS:-}}

      # --- E-posta ---
      # Hiçbir mod tanımlanmazsa DevelopmentEmailSender devreye girer:
      # mailler GÖNDERİLMEZ, yalnızca log'a yazılır. Bu yüzden üretimde
      # mutlaka bir mod seçin (aşağıdaki .env.example'a bakın).
      Mail__Type: ${MAIL__TYPE:-}
      Mail__Gmail__ClientId: ${MAIL__GMAIL__CLIENTID:-}
      Mail__Gmail__ClientSecret: ${MAIL__GMAIL__CLIENTSECRET:-}
      Mail__Gmail__SenderAddress: ${MAIL__GMAIL__SENDERADDRESS:-}
      Mail__Gmail__SenderName: ${MAIL__GMAIL__SENDERNAME:-Geleceğin Fikri}
      Mail__Gmail__RedirectUri: ${MAIL__GMAIL__REDIRECTURI:-}
      # Refresh token önce ENV'den okunur; yoksa DB'deki şifreli kayıt
      # (gmail_refresh_tokens, Id=1) kullanılır — Sprint 11.36.
      # OAuth handshake: /admin/oauth ekranından tetiklenir.
      Mail__Gmail__RefreshToken: ${MAIL__GMAIL__REFRESHTOKEN:-}
      # SMTP modu
      Mail__Host: ${MAIL__HOST:-}
      Mail__Port: ${MAIL__PORT:-587}
      Mail__User: ${MAIL__USER:-}
      Mail__Pass: ${MAIL__PASS:-}
      Mail__From: ${MAIL__FROM:-}
      Mail__FromName: ${MAIL__FROMNAME:-Geleceğin Fikri}
    # Data Protection anahtarları veritabanında saklanır (PersistKeysToDbContext),
    # bu yüzden ayrı volume GEREKMEZ. TOTP secret'ları bu anahtarlarla şifrelenir —
    # veritabanı yedeği bu tabloyu da içermelidir.
    depends_on:
      mysql:
        condition: service_healthy
        required: false   # yalnızca --profile with-mysql
    networks:
      - fikir-net

  # --- Frontend (nginx reverse proxy ve statik sunum) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # nginx reverse proxy için BOŞ bırakın (göreli /api, aynı origin).
        # Ayrı origin dağıtımda: VITE_API_BASE_URL=https://api.kurum.gov.tr
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: fikir-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - fikir-net

  # --- MySQL (yalnızca --profile with-mysql) ---
  # Kendi MySQL sunucunuz varsa BUNU BAŞLATMAYIN.
  mysql:
    image: mysql:8.0
    container_name: fikir-mysql
    profiles: ["with-mysql"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fikir_platformu}
      MYSQL_USER: ${MYSQL_USER:-fikir}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    # Not: --default-authentication-plugin bayrağı MySQL 8.4'te kaldırıldı.
    # Pin'li 8.0 kullanıldığı ve bayrağa ihtiyaç duyulmadığı için eklenmedi.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fikir-net

volumes:
  mysql-data:
    # MySQL verisi. YEDEKLERİNİZDE MUTLAKA BU VOLUME + DataProtectionKeys tablosu olsun.
  denetim-raporlari:
    # YEĞİTEK madde 13/18 — günlük hareket kaydı raporları.
    # Yedeklenmesi önerilir: denetim kaydı kaybolursa YG-13 ihlali doğar.

networks:
  fikir-net:
    driver: bridge
